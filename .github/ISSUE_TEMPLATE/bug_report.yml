name: Bug report
description: Report incorrect AFKSwitch behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AFKSwitch version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: "Claude Code 2.x / Codex ..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
