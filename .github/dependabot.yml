# Version updates once a month, one grouped pull request per ecosystem, so the pinned
# action SHAs and the CI's npm and pip pins do not age silently. Security updates still
# arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /.github/ci
    schedule:
      interval: monthly
    groups:
      ci-npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: monthly
    groups:
      ci-pip:
        patterns: ["*"]
    # CI runs the suite on Python 3.9, the helper's floor. Each version below is the first of
    # its package that needs Python 3.10, so it stays held until the floor moves.
    ignore:
      - dependency-name: pytest
        versions: [">=9.0.0"]
      - dependency-name: jsonschema
        versions: [">=4.26.0"]
      - dependency-name: referencing
        versions: [">=0.37.0"]
      - dependency-name: rpds-py
        versions: [">=0.28.0"]
      - dependency-name: pluggy
        versions: [">=1.7.0"]
      - dependency-name: iniconfig
        versions: [">=2.2.0"]
