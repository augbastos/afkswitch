name: validate

# One run per change: pushes to main, and pull requests (which cover their branches).
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/validate.py

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install personal skills
        shell: pwsh
        run: ./install.ps1
      - name: Verify installed skills
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $HOME '.claude/skills/afk/SKILL.md'))) { throw 'afk not installed' }
          if (-not (Test-Path (Join-Path $HOME '.claude/skills/back/SKILL.md'))) { throw 'back not installed' }
      - name: Uninstall
        shell: pwsh
        run: ./install.ps1 -Uninstall
