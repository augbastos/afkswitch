name: validate

# One run per change: pushes to main, and pull requests (which cover their branches).
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # the helper's floor
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check --quiet pytest jsonschema
      - name: Validate manifests, helper, schemas, capability tables, links, archive
        run: python scripts/validate.py
      - name: Build the plugin archive and list it
        run: |
          zip_path=$(python scripts/package.py)
          python -m zipfile -l "$zip_path"
      - name: Conformance (state incl. concurrency and migration fixtures, schema agreement, checker)
        run: python -m pytest conformance -q -p no:cacheprovider

  mod-tests:
    name: mod tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Switch module tests and strict plugin validation (no login needed)
        run: |
          claude plugin test .
          claude plugin validate --strict .

  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refuse a folder that is not an AFKSwitch skill
        shell: pwsh
        run: |
          $foreign = Join-Path $HOME '.claude/skills/afk'
          New-Item -ItemType Directory -Force -Path $foreign | Out-Null
          Set-Content (Join-Path $foreign 'SKILL.md') 'another skill'
          $refused = $false
          try { ./install.ps1 } catch { $refused = $true }
          if (-not $refused) { throw 'installer overwrote a foreign skill' }
          ./install.ps1 -Uninstall
          if ((Get-Content (Join-Path $foreign 'SKILL.md') -Raw).Trim() -ne 'another skill') { throw 'foreign skill changed or deleted' }
          Remove-Item $foreign -Recurse -Force
      - name: Install personal skills
        shell: pwsh
        run: ./install.ps1
      - name: Verify installed skills and helper
        shell: pwsh
        run: |
          $skills = Join-Path $HOME '.claude/skills'
          foreach ($f in 'afk/SKILL.md', 'back/SKILL.md', 'afk/scripts/afkswitch_state.py', 'back/scripts/afkswitch_state.py') {
            if (-not (Test-Path (Join-Path $skills $f))) { throw "$f not installed" }
          }
          $env:AFKSWITCH_STATE_DIR = Join-Path $env:RUNNER_TEMP 'afkswitch-state'
          $afk = python (Join-Path $skills 'afk/scripts/afkswitch_state.py') afk --context 'smoke test' | ConvertFrom-Json
          $back = python (Join-Path $skills 'back/scripts/afkswitch_state.py') back | ConvertFrom-Json
          if (-not $afk.ok -or $afk.status -ne 'afk') { throw "afk failed: $afk" }
          if (-not $back.ok -or $back.status -ne 'available' -or $back.generation -ne 2) { throw "back failed: $back" }
      - name: Uninstall
        shell: pwsh
        run: ./install.ps1 -Uninstall

  ci-ok:
    # The one check the branch ruleset requires from this workflow. Matrix job
    # names change when a version is added or dropped, and a required check
    # that no longer exists blocks every pull request; this name never changes.
    name: ci-ok
    if: always()
    needs: [checks, mod-tests, windows-installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
